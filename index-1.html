<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>IRON TRACK</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c;--s1:#111116;--s2:#18181f;--s3:#22222c;--border:#2c2c3a;
  --accent:#c8ff00;--red:#ff3d5a;--blue:#3eb8ff;--gold:#ffb800;--green:#00e676;--purple:#b57bee;
  --pec:#ff5c5c;--dos:#3eb8ff;--legs:#ffc300;--bras:#ff8c42;--abs:#b57bee;
  --text:#eeeef5;--muted:#666680;--r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:80px}
.view::-webkit-scrollbar{display:none}
nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(10,10,12,.97);border-top:1px solid var(--border);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;border:none;background:none;cursor:pointer;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.8px;font-family:"DM Sans",sans-serif;text-transform:uppercase}
.nb .i{font-size:19px;line-height:1}
.nb.on{color:var(--accent)}
.ph{padding:18px 18px 0;display:flex;align-items:center;justify-content:space-between}
.pt{font-family:"Bebas Neue",sans-serif;font-size:28px;letter-spacing:2px;color:var(--accent);line-height:1}
.ps{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.sec{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;padding:14px 18px 8px}
.btn{padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:700;font-family:"DM Sans",sans-serif;cursor:pointer;display:block;width:100%;text-align:center}
.btn-y{background:var(--accent);color:#000}
.btn-g{background:var(--s2);border:1.5px solid var(--border);color:var(--text)}
input,textarea{font-family:"DM Sans",sans-serif;background:var(--s2);border:1.5px solid var(--border);color:var(--text);border-radius:10px;font-size:14px;padding:9px 11px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fu{animation:up .2s ease both}
.bb{font-family:"Bebas Neue",sans-serif}
.hero{margin:14px 18px 0;border-radius:var(--r);background:linear-gradient(135deg,#1a2a00,#0a1800);border:1.5px solid #c8ff0030;padding:18px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 80% 0,#c8ff0015,transparent 60%)}
.pbg{height:5px;background:var(--s3);border-radius:3px;overflow:hidden;margin-top:10px}
.pbf{height:100%;background:linear-gradient(90deg,var(--accent),#80ff00);border-radius:3px;transition:width .5s}
.sr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 18px 0}
.sb{background:var(--s1);border:1.5px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.sv{font-family:"Bebas Neue",sans-serif;font-size:26px;color:var(--accent);line-height:1}
.sl{font-size:10px;color:var(--muted);font-weight:700;margin-top:1px}
.card{background:var(--s1);border:1.5px solid var(--border);border-radius:var(--r);padding:14px;margin:10px 18px 0}
.dr{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--s1);border:1.5px solid var(--border);border-radius:11px}
.dr.today{border-color:var(--accent);background:#c8ff0008}
.wscr{display:flex;gap:5px;overflow-x:auto;padding:10px 18px;scrollbar-width:none}
.wscr::-webkit-scrollbar{display:none}
.wk{flex-shrink:0;width:42px;height:42px;border-radius:10px;border:1.5px solid var(--border);background:var(--s1);color:var(--muted);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;position:relative}
.wk.on{background:var(--accent);border-color:var(--accent);color:#000;transform:scale(1.07)}
.wk.cur:after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--red)}
.wk.hd{border-color:#c8ff0055;color:var(--accent)}
.wk.hd.on{color:#000}
.stabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:0 18px}
.stab{padding:8px 3px;border-radius:10px;border:1.5px solid var(--border);background:var(--s1);font-size:9px;font-weight:700;cursor:pointer;text-align:center;color:var(--muted);transition:all .15s}
.stab .dot{width:6px;height:6px;border-radius:50%;background:var(--c,var(--muted));margin:0 auto 3px}
.stab.on{background:var(--c);border-color:var(--c);color:#000}
.exlist{padding:10px 18px 0;display:flex;flex-direction:column;gap:8px}
.exc{background:var(--s1);border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden}
.exc.done{border-color:#00e67640;opacity:.8}
.exc.open{border-color:var(--accent)}
.exh{padding:12px 13px;display:flex;align-items:flex-start;gap:9px;cursor:pointer;user-select:none}
.exn{width:24px;height:24px;border-radius:6px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0;margin-top:1px}
.done .exn{background:var(--green);color:#000}
.exi{flex:1;min-width:0}
.exname{font-size:13px;font-weight:700;line-height:1.2}
.exmeta{font-size:10px;color:var(--muted);margin-top:2px;display:flex;gap:7px;flex-wrap:wrap}
.excol{text-align:right;flex-shrink:0;min-width:65px}
.exb{display:none;padding:0 13px 13px}
.exc.open .exb{display:block}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:8px}
.sbox{background:var(--s2);border:1.5px solid var(--border);border-radius:9px;padding:7px 6px;text-align:center;transition:border-color .2s}
.sbox.ok{border-color:#00e67660;background:#00e67608}
.sbox label{font-size:9px;font-weight:700;color:var(--muted);display:block;margin-bottom:3px}
.sbox .sbhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.sbox .sbhead label{margin:0}
.sbox .sbbtns{display:flex;gap:3px}
.sbox .sbbtns button{padding:2px 7px;border-radius:5px;border:none;font-size:10px;font-weight:700;cursor:pointer}
.sbox .sbbtns .bt-go{background:#ffb80022;color:var(--gold)}
.sbox .sbbtns .bt-ok{background:#00e67622;color:var(--green)}
.sr2{display:flex;gap:3px}
.sr2 input{background:var(--bg);border:1px solid var(--border);border-radius:5px;font-size:12px;font-weight:700;text-align:center;padding:5px 2px}
.sr2 input:focus{border-color:var(--accent)}
.slim{font-size:9px;display:flex;gap:3px;margin-top:2px}
.slim span{flex:1;text-align:center;color:var(--muted)}
.stimer-disp{font-family:"Bebas Neue",sans-serif;font-size:13px;color:var(--gold);text-align:center;margin-top:3px;display:none}
.notea{width:100%;resize:none;height:40px;font-size:12px;margin-bottom:8px;background:var(--bg)}
.dtog{width:100%;padding:10px;border-radius:9px;border:1.5px solid var(--border);background:var(--s2);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:"DM Sans",sans-serif;text-align:center}
.dtog.done{background:#00e67618;border-color:#00e67660;color:var(--green)}
.padv{background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;margin-bottom:8px;display:flex;gap:8px;font-size:12px;color:var(--muted)}
.padv strong{color:var(--text);display:block;font-size:12px;margin-bottom:1px}
.editrow{display:flex;gap:7px;align-items:center;margin-bottom:9px}
.editrow label{font-size:10px;font-weight:700;color:var(--muted);white-space:nowrap}
.editrow input{font-size:13px;font-weight:700;text-align:center;padding:6px 4px}
.rpanel{display:none;background:var(--s2);border-radius:10px;padding:10px;margin-bottom:9px}
.rpanel input{margin-bottom:7px;font-size:13px}
.catfilters{display:flex;gap:5px;overflow-x:auto;padding:0 0 6px;scrollbar-width:none;flex-wrap:nowrap;margin-bottom:6px}
.catfilters::-webkit-scrollbar{display:none}
.catf{flex-shrink:0;padding:5px 10px;border-radius:99px;border:1px solid var(--border);background:var(--s1);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.catf.on{border-color:var(--accent);color:var(--accent);background:#c8ff0015}
.rlist{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.ritem{padding:8px 11px;background:var(--s1);border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.ritem:active{border-color:var(--accent)}
.ritem .rcat{font-size:9px;color:var(--muted);font-weight:400;margin-left:5px;flex-shrink:0}
.ctimer{font-family:"Bebas Neue",sans-serif;font-size:48px;color:var(--accent);text-align:center;line-height:1;margin:8px 0}
.cbtns{display:flex;gap:7px;margin-top:8px}
.cbtns button{flex:1;padding:9px;border-radius:9px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:"DM Sans",sans-serif}
.bform{margin:10px 18px 0;background:var(--s1);border:1.5px solid var(--border);border-radius:var(--r);padding:14px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fr.c3{grid-template-columns:repeat(3,1fr)}
.ff{display:flex;flex-direction:column;gap:4px}
.ff label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.bts{margin:10px 18px 0;overflow-x:auto}
.bt{border-collapse:collapse;width:100%;min-width:440px}
.bt th{background:var(--s2);padding:7px 9px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center;border-bottom:1px solid var(--border)}
.bt td{padding:7px 9px;font-size:11px;text-align:center;border-bottom:1px solid var(--s2)}
.bt tr:nth-child(even) td{background:var(--s1)}
.dp{color:var(--green);font-weight:700}.dn{color:var(--red);font-weight:700}.dz{color:var(--muted)}
.dtog2{display:flex;gap:7px;padding:10px 18px 0}
.dtog2 button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:var(--s1);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;font-family:"DM Sans",sans-serif}
.dtog2 button.on{background:var(--accent);border-color:var(--accent);color:#000}
.mbars{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 18px 0}
.mbar{background:var(--s1);border:1.5px solid var(--border);border-radius:12px;padding:9px 5px;text-align:center}
.mv{font-family:"Bebas Neue",sans-serif;font-size:17px;line-height:1}
.ml{font-size:9px;font-weight:700;color:var(--muted);margin-top:1px}
.mpb{height:3px;border-radius:2px;background:var(--s3);margin-top:4px;overflow:hidden}
.mpf{height:100%;border-radius:2px;transition:width .3s}
.fbuilder{margin:10px 18px 0;background:var(--s1);border:1.5px solid var(--border);border-radius:var(--r);padding:14px}
.fsw{position:relative;margin-bottom:9px}
.fsw input{padding-right:36px}
.fsc{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;padding:3px}
.fres{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
.fri{display:flex;align-items:center;gap:9px;padding:8px 11px;background:var(--s2);border:1px solid var(--border);border-radius:8px;cursor:pointer}
.fri:active{border-color:var(--accent)}
.fri .fn{flex:1;font-size:12px;font-weight:600;line-height:1.3}
.fri .fb{font-size:10px;color:var(--muted);margin-top:1px}
.fri .fm{font-size:10px;color:var(--muted);text-align:right;line-height:1.5;flex-shrink:0}
.src{font-size:9px;padding:2px 5px;border-radius:99px;background:#ff571520;color:#ff8844;border:1px solid #ff571530;font-weight:700;margin-left:5px}
.afform{background:var(--s2);border:1px solid var(--accent);border-radius:9px;padding:11px;margin-bottom:9px}
.afn{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px}
.afm{font-size:11px;color:var(--muted);margin-bottom:7px;line-height:1.5}
.afrow{display:flex;align-items:center;gap:7px}
.afrow input{flex:1;padding:7px 9px;font-size:14px}
.afrow .afu{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.afrow button{padding:8px 13px;border-radius:8px;border:none;background:var(--accent);color:#000;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.qrow{display:flex;gap:5px;flex-wrap:wrap}
.qchip{padding:5px 10px;border-radius:99px;border:1px solid var(--border);background:var(--s2);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}
.qchip:active{border-color:var(--accent);color:var(--accent)}
.mlog{margin:10px 18px 0;display:flex;flex-direction:column;gap:6px}
.mli{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--s1);border:1.5px solid var(--border);border-radius:11px}
.mli .mn{flex:1;font-size:12px;font-weight:600}
.mli .mq{font-size:11px;color:var(--muted);margin-right:3px}
.mli .mm{text-align:right;font-size:10px;line-height:1.5}
.mli .md{background:none;border:none;color:var(--red);font-size:15px;cursor:pointer;padding:3px;flex-shrink:0}
.suplist{padding:0 18px;display:flex;flex-direction:column;gap:7px}
.supi{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--s1);border:1.5px solid var(--border);border-radius:11px}
.supi .sinf{flex:1}
.supi .sinf strong{font-size:12px;font-weight:700}
.supi .sinf span{font-size:10px;color:var(--muted);display:block;margin-top:1px}
.supi .sd{font-size:11px;font-weight:700;color:var(--accent)}
.rrow{display:flex;align-items:center;gap:11px;padding:9px 13px;background:var(--s1);border:1.5px solid var(--border);border-radius:11px}
.est{text-align:center;padding:36px 18px;color:var(--muted)}
.est .ei{font-size:36px;margin-bottom:8px}
.est p{font-size:12px;line-height:1.7}
#cl{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.cp{position:absolute;border-radius:2px;animation:cf 1.2s ease-in forwards}
@keyframes cf{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--s2);border:1.5px solid var(--border);border-radius:11px;padding:9px 16px;font-size:12px;font-weight:700;z-index:500;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#rest-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#rest-overlay.show{display:flex}
.ro-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.ro-exname{font-size:15px;font-weight:700;color:var(--text);text-align:center;padding:0 20px;max-width:300px}
.ro-circle{width:150px;height:150px;border-radius:50%;border:4px solid var(--s3);display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}
.ro-circle svg{position:absolute;top:-4px;left:-4px;width:158px;height:158px;transform:rotate(-90deg)}
.ro-circle circle{fill:none;stroke:var(--blue);stroke-width:4;stroke-linecap:round}
.ro-secs{font-family:"Bebas Neue",sans-serif;font-size:54px;color:var(--blue);line-height:1}
.ro-lbl{font-size:10px;color:var(--muted);font-weight:700}
.ro-presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ro-presets button{padding:7px 14px;border-radius:99px;border:1.5px solid var(--border);background:var(--s2);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}
.ro-presets button.on{border-color:var(--blue);color:var(--blue);background:#3eb8ff15}
.ro-skip{padding:11px 30px;border-radius:99px;border:none;background:var(--s2);color:var(--text);font-size:13px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="cl"></div>
<div class="toast" id="toast"></div>
<div id="rest-overlay">
  <div class="ro-title">TEMPS DE REPOS</div>
  <div class="ro-exname" id="ro-exname"></div>
  <div class="ro-circle">
    <svg viewBox="0 0 158 158"><circle id="ro-arc" cx="79" cy="79" r="71" stroke-dasharray="446" stroke-dashoffset="0"/></svg>
    <div class="ro-secs" id="ro-secs">90</div>
    <div class="ro-lbl">secondes</div>
  </div>
  <div class="ro-presets">
    <button onclick="setRestDur(60)" id="rbtn-60">1 min</button>
    <button onclick="setRestDur(90)" id="rbtn-90" class="on">1m30</button>
    <button onclick="setRestDur(120)" id="rbtn-120">2 min</button>
    <button onclick="setRestDur(180)" id="rbtn-180">3 min</button>
  </div>
  <button class="ro-skip" onclick="skipRest()">Passer</button>
</div>
<div class="app">
  <div class="view" id="view"></div>
  <nav>
    <button class="nb on" data-p="dash" onclick="go('dash')"><span class="i">&#128202;</span>BILAN</button>
    <button class="nb" data-p="train" onclick="go('train')"><span class="i">&#127947;</span>SEANCE</button>
    <button class="nb" data-p="body" onclick="go('body')"><span class="i">&#128207;</span>CORPS</button>
    <button class="nb" data-p="nutri" onclick="go('nutri')"><span class="i">&#127869;</span>NUTRI</button>
  </nav>
</div>
<script>
var START = new Date(2026,2,23);
var PH=[
  {r:[1,2], lb:"Phase 1 Readaptation",   co:"#ff6b35",sh:"PH1"},
  {r:[3,6], lb:"Phase 2 Montee en charge",co:"#ffb800",sh:"PH2"},
  {r:[7,12],lb:"Phase 3 Volume maximum",  co:"#00c853",sh:"PH3"},
  {r:[13,18],lb:"Phase 4 Force + Seche",  co:"#2196f3",sh:"PH4"},
  {r:[19,26],lb:"Phase 5 Peak",           co:"#e94560",sh:"PH5"},
];
var SESS=[
  {id:"pec", nm:"SEANCE 1",em:"S1",co:"var(--pec)", dy:"Lundi",   mu:"Pectoraux - Epaules"},
  {id:"dos", nm:"SEANCE 2",em:"S2",co:"var(--dos)", dy:"Mardi",   mu:"Dos - Biceps si temps"},
  {id:"abs", nm:"SEANCE 3",em:"S3",co:"var(--abs)", dy:"Mercredi",mu:"Abdos 15min - Cardio 45min"},
  {id:"legs",nm:"SEANCE 4",em:"S4",co:"var(--legs)",dy:"Jeudi",   mu:"Quadris - Ischios - Mollets"},
  {id:"bras",nm:"SEANCE 5",em:"S5",co:"var(--bras)",dy:"Vendredi",mu:"Bras - Epaules"},
];
var BEX={
  "pec":[
    {nm:"Developpe couche barre",     s:4,r:"6-8", base:60, rest:120,mu:"Pectoraux"},
    {nm:"Developpe incline halteres", s:3,r:"10",  base:24, rest:90, mu:"Pectoraux sup"},
    {nm:"Machine convergente pecs",   s:3,r:"12",  base:50, rest:90, mu:"Pectoraux"},
    {nm:"Ecarte cable croise",        s:3,r:"12-15",base:15,rest:60, mu:"Pectoraux finition"},
    {nm:"Elevations laterales",       s:3,r:"12-15",base:10,rest:60, mu:"Deltoides lat"},
  ],
  "dos":[
    {nm:"Tractions lestees",          s:4,r:"6-8", base:0,  rest:120,mu:"Grand dorsal",bw:true},
    {nm:"Rowing barre",               s:4,r:"8",   base:60, rest:90, mu:"Grand dorsal"},
    {nm:"Tirage poulie haute",        s:3,r:"10-12",base:50,rest:90, mu:"Grand dorsal"},
    {nm:"Tirage horizontal cable",    s:3,r:"12",  base:40, rest:75, mu:"Rhomboides"},
    {nm:"Curl barre si temps",        s:3,r:"10",  base:30, rest:60, mu:"Biceps"},
  ],
  "abs":[
    {nm:"Releve de jambes suspendu",  s:4,r:"12-15",base:0, rest:60, mu:"Droit abdominal",bw:true},

function cw(){return Math.max(1,Math.min(26,Math.floor((new Date()-START)/(7*864e5))+1));}
function wd(w){return new Date(START.getTime()+(w-1)*7*864e5).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});}
function ph(w){for(var i=0;i<PH.length;i++){if(w>=PH[i].r[0]&&w<=PH[i].r[1])return PH[i];}return PH[0];}
function todow(){return new Date().getDay();}

function getSessName(sid){
  if(DB.snames&&DB.snames[sid])return DB.snames[sid];
  for(var i=0;i<SESS.length;i++){if(SESS[i].id===sid)return SESS[i].nm;}
  return sid;
}

  save();
}

function getChg(sid,ei,week){
  var b=BEX[sid][ei];
  if(!b||b.bw||b.tm||week===1)return null;
  var w1=maxKg(sid,ei,1);
  if(w1){var m=week<=2?1:week<=6?1.05:week<=12?1.125:week<=18?1.20:1.30;return Math.round(w1*m/2.5)*2.5;}
  var fm=week<=2?0.8:week<=6?1:week<=12?1.1:week<=18?1.175:1.25;
  return b.base?Math.round(b.base*fm/2.5)*2.5:null;
}
function maxKg(sid,ei,week){
  var d=(DB.tr[week]||{})[sid];if(!d||!d[ei])return null;
  var v=[];
  for(var i=0;i<d[ei].sets.length;i++){var k=parseFloat(d[ei].sets[i].kg);if(!isNaN(k)&&k>0)v.push(k);}
  return v.length?Math.max.apply(null,v):null;
}
function histMax(sid,ei,upTo){
  var best=null;
  for(var w=1;w<upTo;w++){var m=maxKg(sid,ei,w);if(m!==null&&(best===null||m>best))best=m;}
  return best;
}
function getExD(w,s,i){
  if(!DB.tr[w])DB.tr[w]={};
  if(!DB.tr[w][s])DB.tr[w][s]={};
  var b=i<BEX[s].length?BEX[s][i]:null;
  var ns=b?b.s:3;
  if(!DB.tr[w][s][i]){
    var sets=[];for(var k=0;k<ns;k++)sets.push({kg:"",reps:""});
    DB.tr[w][s][i]={nm:b?b.nm:"Exercice",sets:sets,done:false,note:"",sc:null,rt:null,rd:null};
  }
  return DB.tr[w][s][i];
}
function sessDone(w,s){
  for(var i=0;i<BEX[s].length;i++){if(!DB.tr[w]||!DB.tr[w][s]||!DB.tr[w][s][i]||!DB.tr[w][s][i].done)return false;}
  return true;
}
function totalSess(){
  var t=0;
  var wks=Object.keys(DB.tr||{});
  for(var i=0;i<wks.length;i++){
    var wk=DB.tr[wks[i]];
    for(var j=0;j<SESS.length;j++){if(sdwk(wk,SESS[j].id))t++;}
  }
  return t;
}
function sdwk(wk,sid){
  if(!wk||!wk[sid])return false;
  for(var i=0;i<BEX[sid].length;i++){if(!wk[sid][i]||!wk[sid][i].done)return false;}
  return true;
}
function getPRs(){
  var prs=[];
  for(var si=0;si<SESS.length;si++){
    var se=SESS[si];
    if(se.id==="abs")continue;
    var exs=BEX[se.id];
    for(var ei=0;ei<exs.length;ei++){
      var b=exs[ei];
      if(b.bw||b.tm)continue;
      var m=histMax(se.id,ei,27);
      if(m!==null)prs.push({nm:getExD(1,se.id,ei).nm||b.nm,kg:m});
    }
  }
  prs.sort(function(a,b){return b.kg-a.kg;});
  return prs.slice(0,6);
}

function startRest(exNm,dur){
  var d=dur||restDur;
  restTotal=d;restLeft=d;
  var ne=document.getElementById("ro-exname");if(ne)ne.textContent=exNm;
  var ns=document.getElementById("ro-secs");if(ns)ns.textContent=d;
  updateRestArc();
  var ov=document.getElementById("rest-overlay");if(ov)ov.classList.add("show");
  clearInterval(restI);
  restI=setInterval(function(){
    restLeft--;
    var el=document.getElementById("ro-secs");if(el)el.textContent=restLeft;
    updateRestArc();
    if(restLeft<=0){
      clearInterval(restI);
      skipRest();
      if(navigator.vibrate)navigator.vibrate([200,100,200]);
      showToast("Repos termine !");
    }
  },1000);
}
function updateRestArc(){
  var arc=document.getElementById("ro-arc");if(!arc)return;
  var pct=restLeft/restTotal;
  arc.style.strokeDashoffset=446-(446*pct);
}
function skipRest(){
  clearInterval(restI);
  var ov=document.getElementById("rest-overlay");if(ov)ov.classList.remove("show");
}
function setRestDur(d){
  restDur=d;restLeft=d;restTotal=d;
  var el=document.getElementById("ro-secs");if(el)el.textContent=d;
  updateRestArc();

  for(var i=0;i<btns.length;i++)btns[i].classList.remove("on");
  var b=document.getElementById("rbtn-"+d);if(b)b.classList.add("on");
}

function startSetTimer(i,si){
  var key=i+"-"+si;
  if(setTimers[key]){clearInterval(setTimers[key]);delete setTimers[key];}
  setTimerSecs[key]=0;
  var el=document.getElementById("stmr-"+i+"-"+si);
  if(el){el.style.display="block";el.textContent="0:00";}
  setTimers[key]=setInterval(function(){
    setTimerSecs[key]=(setTimerSecs[key]||0)+1;
    var s=setTimerSecs[key];
    var disp=Math.floor(s/60)+":"+(s%60<10?"0":"")+s%60;

    if(el2)el2.textContent=disp;

  },1000);

}

// NAV
function go(p){
  pg=p;
  var btns=document.querySelectorAll(".nb");
  for(var i=0;i<btns.length;i++)btns[i].classList.toggle("on",btns[i].dataset.p===p);

function render(){

function mkEx(container,i){
  var s=tS,w=tW;

  var isW1=w===1&&!isCustom&&!isTm;
  var ns=exd.sc||(base?base.s:3);
  var rt=exd.rt||(base?base.r:"10");
  var rd=exd.rd||(base?base.rest:90)||90;
  var charge=(!isCustom&&!isBW&&!isTm)?getChg(s,i,w):null;
  var prev=!isCustom?histMax(s,i,w):null;
  while(exd.sets.length<ns)exd.sets.push({kg:"",reps:""});

  var cdsp="";
  if(isTm){cdsp='<div class="bb" style="font-size:18px;color:var(--purple)">'+rt+'</div>';}

  } else if(isCustom){cdsp='<div class="bb" style="font-size:14px;color:var(--purple)">PERSO</div>';}

  var adv="";
  if(!isW1&&prev&&charge){
    var diff=parseFloat((charge-prev).toFixed(1));
    if(diff>0)adv='<div class="padv"><div style="font-size:15px">&#128640;</div><div><strong>+'+diff+'kg vs record</strong>Objectif ambitieux !</div></div>';
    else if(diff===0)adv='<div class="padv"><div style="font-size:15px">&#127919;</div><div><strong>Au niveau du record</strong>Vise toutes les series !</div></div>';

  var setsHtml="";

      setsHtml+='<input type="number" inputmode="numeric" placeholder="reps" value="'+h(st.reps)+'" oninput="setV('+i+','+si2+',\'reps\',this.value)">';

function togEx(i){

function filtR(i,q){

  var cat=curCat[i]||null;

    if(cat&&ALL_EX[j].cat!==cat)continue;
    if(lq&&ALL_EX[j].nm.toLowerCase().indexOf(lq)===-1)continue;
    pool.push(ALL_EX[j]);
  }
  var html="";
  for(var pi=0;pi<pool.length;pi++){
    var e=pool[pi];

    var qsafe=q.replace(/\\/g,"").replace(/'/g,"").replace(/"/g,"");
    html+='<div class="ritem" style="border-color:var(--accent)44;background:var(--accent)08" onclick="doReplace('+i+',\''+qsafe+'\')"><span style="color:var(--accent)">Utiliser: '+h(q)+'</span><span class="rcat" style="color:var(--accent)">Libre</span></div>';

async function offSearch(q){
  var el=document.getElementById("fres");if(!el)return;
  try{
    var url="https://world.openfoodfacts.org/cgi/search.pl?search_terms="+encodeURIComponent(q)+"&search_simple=1&action=process&json=1&page_size=20&fields=product_name,brands,nutriments&lc=fr";
    var resp=await fetch(url,{signal:AbortSignal.timeout(9000)});
    if(!resp.ok)throw new Error("err");
    var data=await resp.json();
    if(!document.getElementById("fres"))return;
    var prods=(data.products||[]).filter(function(p){var n=p.nutriments;return p.product_name&&n&&(n["energy-kcal_100g"]!==undefined||n.proteins_100g!==undefined);});
    if(!prods.length){document.getElementById("fres").innerHTML='<div style="text-align:center;padding:12px;color:var(--muted);font-size:11px">Aucun resultat OFF</div>';return;}
    var html="";
    for(var pi=0;pi<prods.length&&pi<12;pi++){
      var p=prods[pi];var n=p.nutriments||{};
      var prot=Math.round((n.proteins_100g||0)*10)/10;
      var carb=Math.round((n.carbohydrates_100g||0)*10)/10;
      var fat=Math.round((n.fat_100g||0)*10)/10;
      var kcal=Math.round(n["energy-kcal_100g"]||(n.energy_100g||0)/4.184||0);
      if(kcal===0&&prot===0)continue;
      var brand=(p.brands||"").split(",")[0].trim();
      var nm2=p.product_name.slice(0,45);
      var enc=encodeURIComponent(JSON.stringify({nm:nm2,brand:brand,u:"g",p:prot,g:carb,l:fat,kc:kcal,src:"off"}));
      html+='<div class="fri" onclick="selOFF(\''+enc+'\')"><div style="flex:1"><div class="fn">'+h(nm2)+'<span class="src">OFF</span></div>'+(brand?'<div class="fb">'+h(brand)+'</div>':"")+'</div><div class="fm">'+prot+'g P - '+kcal+'kc<br>/100g</div></div>';
    }
    document.getElementById("fres").innerHTML=html||'<div style="text-align:center;padding:12px;color:var(--muted);font-size:11px">Aucun resultat</div>';
  }catch(e){var el2=document.getElementById("fres");if(el2)el2.innerHTML='<div style="text-align:center;padding:12px;color:var(--muted);font-size:11px">Pas de connexion</div>';}
}

      for(var bi=0;bi<(DB.body||[]).length;bi++){var e=DB.body[bi];s2.push([e.date,e.poids||"",e.bras||"",e.poitrine||"",e.taille||"",e.cuisse||"",e.sleep||""]);}
      var s3=[["Date","Aliment","Quantite","Unite","Proteines g","Glucides g","Lipides g","Kcal"]];
      var nkeys=Object.keys(DB.nlog||{});
      for(var nki=0;nki<nkeys.length;nki++){var dt=nkeys[nki];var nl=DB.nlog[dt]||[];for(var nli=0;nli<nl.length;nli++){var ne=nl[nli];s3.push([dt,ne.nm,ne.qty,ne.u,+(ne.p).toFixed(1),+(ne.g).toFixed(1),+(ne.l).toFixed(1),Math.round(ne.kc)]);}}
      var s4=[["Exercice","Record kg"]];var prs2=getPRs();for(var pri=0;pri<prs2.length;pri++){s4.push([prs2[pri].nm,prs2[pri].kg]);}
      dlXLSX([{nm:"Seances",rows:s1},{nm:"Corps",rows:s2},{nm:"Nutrition",rows:s3},{nm:"Records",rows:s4}],"iron_track.xlsx");
      showToast("Excel telecharge !");
    }catch(e){showToast("Erreur: "+e.message);}
  },120);
}
function dlXLSX(sheets,fn){
  var enc=new TextEncoder();
  var strs=[],sm={};
  function si(v){var s=String(v==null?"":v);if(sm[s]===undefined){sm[s]=strs.length;strs.push(s);}return sm[s];}
  var shXMLs=sheets.map(function(sh){
    var x='<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
    sh.rows.forEach(function(row,ri){
      x+='<row r="'+(ri+1)+'">';
      row.forEach(function(cell,ci){
        var col=ci<26?String.fromCharCode(65+ci):(String.fromCharCode(64+Math.floor(ci/26))+String.fromCharCode(65+(ci%26)));
        var ref=col+(ri+1);var v=cell==null?"":cell;
        if(typeof v==="number"&&!isNaN(v))x+='<c r="'+ref+'"><v>'+v+'</v></c>';
        else x+='<c r="'+ref+'" t="s"><v>'+si(v)+'</v></c>';
      });
      x+="</row>";
    });
    x+="</sheetData></worksheet>";return x;
  });
  var ss='<?xml version="1.0" encoding="UTF-8"?><sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  strs.forEach(function(s){ss+='<si><t xml:space="preserve">'+String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")+'</t></si>';});
  ss+="</sst>";
  var wbX='<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map(function(s,i){return '<sheet name="'+s.nm+'" sheetId="'+(i+1)+'" r:id="rId'+(i+2)+'"/>';}).join("")+"</sheets></workbook>";
  var relX='<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/>'+sheets.map(function(_,i){return '<Relationship Id="rId'+(i+2)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';}).join("")+"</Relationships>";
  var ctX='<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/>'+sheets.map(function(_,i){return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';}).join("")+"</Types>";
  var rootR='<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  var files=[{n:"[Content_Types].xml",d:enc.encode(ctX)},{n:"_rels/.rels",d:enc.encode(rootR)},{n:"xl/workbook.xml",d:enc.encode(wbX)},{n:"xl/_rels/workbook.xml.rels",d:enc.encode(relX)},{n:"xl/sharedStrings.xml",d:enc.encode(ss)}];
  shXMLs.forEach(function(x,i){files.push({n:"xl/worksheets/sheet"+(i+1)+".xml",d:enc.encode(x)});});
  var zip=mkZip(files);
  var blob=new Blob([zip],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download=fn;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1000);
}
function mkZip(files){
  var parts=[],cdir=[];var off=0;
  var T=(function(){var t=new Uint32Array(256);for(var i=0;i<256;i++){var v=i;for(var j=0;j<8;j++)v=(v&1)?0xEDB88320^(v>>>1):(v>>>1);t[i]=v;}return t;})();
  function crc(d){var c=0xFFFFFFFF;for(var i=0;i<d.length;i++)c=T[(c^d[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
  var enc2=new TextEncoder();
  files.forEach(function(f){
    var nb=enc2.encode(f.n),cr=crc(f.d);
    var loc=new Uint8Array(30+nb.length+f.d.length);var dv=new DataView(loc.buffer);
    dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0,true);dv.setUint16(8,0,true);dv.setUint16(10,0,true);dv.setUint16(12,0,true);dv.setUint32(14,cr,true);dv.setUint32(18,f.d.length,true);dv.setUint32(22,f.d.length,true);dv.setUint16(26,nb.length,true);dv.setUint16(28,0,true);loc.set(nb,30);loc.set(f.d,30+nb.length);parts.push(loc);
    var cd=new Uint8Array(46+nb.length);var cv=new DataView(cd.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0,true);cv.setUint16(10,0,true);cv.setUint16(12,0,true);cv.setUint16(14,0,true);cv.setUint32(16,cr,true);cv.setUint32(20,f.d.length,true);cv.setUint32(24,f.d.length,true);cv.setUint16(28,nb.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,off,true);cd.set(nb,46);cdir.push(cd);off+=loc.length;
  });
  var cdsz=cdir.reduce(function(a,b){return a+b.length;},0);
  var eocd=new Uint8Array(22);var ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,cdsz,true);ev.setUint32(16,off,true);ev.setUint16(20,0,true);
  var all=parts.concat(cdir).concat([eocd]);
  var tot=all.reduce(function(a,b){return a+b.length;},0);
  var out=new Uint8Array(tot);var pos=0;
  all.forEach(function(b){out.set(b,pos);pos+=b.length;});return out;
}
